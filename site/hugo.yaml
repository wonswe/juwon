  #   Content: I learn and write about coffee

menu:
  main:
    - name: home
      pageRef: /
      weight: 1

    - name: espresso
      pageRef: /blog/espresso
      weight: 2

    - name: pourover
      pageRef: /blog/pourover
      weight: 3
