baseURL: https://wonswe.github.io/juwon/
title: juwon
locale: en-US
defaultContentLanguage: en

module:
  imports:
    - path: github.com/adityatelange/hugo-PaperMod

pagination:
  pagerSize: 10

params:
  env: production
  mainSections:
    - blog
  defaultTheme: auto
  ShowReadingTime: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  disableSpecial1stPost: true

menu:
  main:
    - name: Home
      pageRef: /
      weight: 1

    - name: Espresso
      pageRef: /blog/espresso
      weight: 2

    - name: Pourover
      pageRef: /blog/pourover
      weight: 3
